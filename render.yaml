# Render blueprint. Push this repo to GitHub, then in Render choose
# "New +" -> "Blueprint" and point it at the repo.
services:
  - type: web
    name: surfaced
    runtime: python
    plan: free
    region: oregon
    buildCommand: "echo 'no build step: standard library only'"
    startCommand: "python3 server.py"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: SURFACED_RATE_LIMIT
        value: "12"
      # Set this to your live URL after the first deploy, e.g.
      # https://surfaced.onrender.com  — it drives canonical and OG tags.
      - key: SURFACED_BASE_URL
        sync: false
      # Stripe. Set the values in the Render dashboard, never in this file.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: SURFACED_CREDITS_PER_PURCHASE
        value: "1"
      # The credit ledger MUST live on the persistent disk below. On the
      # default ephemeral filesystem every redeploy destroys it, and paying
      # customers silently lose the credits they bought.
      - key: SURFACED_DATA_DIR
        value: /var/data
    # Requires a paid instance type; free instances cannot mount disks.
    disk:
      name: surfaced-data
      mountPath: /var/data
      sizeGB: 1
